<div class="animate-fade-in">
  <!-- Loading Skeleton -->
  <div *ngIf="isLoading()" class="space-y-6">
    <div class="flex space-x-4 mb-6 overflow-x-auto pb-2">
      <div *ngFor="let i of [1,2,3,4]" class="h-10 w-24 bg-gray-200 rounded-full animate-pulse flex-shrink-0"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let i of [1,2,3,4]" class="h-32 bg-gray-100 rounded-xl animate-pulse"></div>
    </div>
  </div>

  <div *ngIf="!isLoading()">
    <h2 class="text-xl font-bold text-gray-900 mb-6">Chọn dịch vụ</h2>

    <!-- Categories Tabs -->
    <div class="flex space-x-2 overflow-x-auto pb-4 mb-4 scrollbar-hide">
      <button *ngFor="let cat of categories()"
              (click)="activeCategoryId.set(cat.categoryId)"
              class="px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors border"
              [ngClass]="activeCategoryId() === cat.categoryId ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'">
        {{ cat.categoryName }}
      </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="error()" class="mb-4 text-sm text-red-600 bg-red-50 p-3 rounded-lg">
      {{ error() }}
    </div>

    <!-- Services Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
      <ng-container *ngFor="let cat of categories()">
        <ng-container *ngIf="activeCategoryId() === cat.categoryId">
          <div *ngFor="let svc of cat.services"
               (click)="toggleService(svc)"
               class="relative border rounded-xl p-4 cursor-pointer transition-all hover:border-gray-400 group"
               [ngClass]="isSelected(svc.id) ? 'border-gray-900 bg-gray-50 ring-1 ring-gray-900' : 'border-gray-200 bg-white'">
            
            <div class="flex justify-between items-start">
              <div class="flex-1 pr-4">
                <h3 class="font-semibold text-gray-900 mb-1">{{ svc.name }}</h3>
                <p class="text-sm text-gray-500 line-clamp-2 md:h-10">{{ svc.description || 'Không có mô tả' }}</p>
                <div class="mt-3 flex items-center text-sm font-medium text-gray-900">
                  <span>{{ svc.price | number }} đ</span>
                  <span class="mx-2 text-gray-300">•</span>
                  <span class="text-gray-500">{{ svc.durationM }} phút</span>
                </div>
              </div>
              
              <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors"
                   [ngClass]="isSelected(svc.id) ? 'border-gray-900 bg-gray-900' : 'border-gray-300 group-hover:border-gray-400'">
                <svg *ngIf="isSelected(svc.id)" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </div>
            </div>
          </div>
        </ng-container>
      </ng-container>
    </div>

    <!-- Footer Actions -->
    <div class="flex items-center justify-between pt-6 border-t border-gray-100">
      <div class="text-sm">
        <span class="text-gray-500 block mb-1">Đã chọn: <strong class="text-gray-900">{{ localSelected().length }} dịch vụ</strong></span>
        <span class="text-gray-900 font-bold text-lg">{{ getTotalPrice() | number }} đ</span>
      </div>
      <button (click)="handleNext()" 
              class="px-8 py-3 bg-gray-900 text-white rounded-xl font-medium hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900">
        Tiếp theo
      </button>
    </div>
  </div>
</div>
