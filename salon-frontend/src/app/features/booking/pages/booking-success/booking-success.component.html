<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-sm border border-gray-100 p-8 text-center animate-fade-in relative overflow-hidden">
    
    <!-- Confetti / Success SVG -->
    <div class="relative w-28 h-28 mx-auto mb-6">
      <div class="absolute inset-0 bg-green-100 rounded-full animate-ping opacity-20"></div>
      <div class="absolute inset-2 bg-green-50 rounded-full flex items-center justify-center">
        <svg class="w-12 h-12 text-green-500 transform transition-transform duration-500 scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
    </div>

    <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Đặt Lịch Thành Công!</h1>
    <p class="text-gray-500 mb-8">Cảm ơn bạn đã lựa chọn Smart Salon. Lịch hẹn của bạn đã được ghi nhận và đang chờ xác nhận.</p>

    <!-- Booking Info Card -->
    <div *ngIf="bookingData" class="bg-gray-50 rounded-2xl p-5 mb-8 text-left border border-gray-100">
      <div class="flex justify-between items-center pb-4 border-b border-gray-200 mb-4">
        <span class="text-sm text-gray-500 font-medium">Mã lịch hẹn</span>
        <span class="font-bold text-gray-900 text-lg">#{{ bookingData?.id }}</span>
      </div>
      <div class="space-y-3 font-medium">
        <div class="flex items-center text-gray-700">
          <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          {{ bookingData?.apptDate | date:'dd/MM/yyyy' }}
        </div>
        <div class="flex items-center text-gray-700">
          <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          {{ bookingData?.startTime }}
        </div>
        <div class="flex items-center text-gray-700">
          <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          {{ bookingData?.staffName || 'Bất kỳ thợ nào' }}
        </div>
      </div>
    </div>

    <div *ngIf="!bookingData" class="mb-8"></div>

    <!-- Actions -->
    <div class="space-y-3">
      <button (click)="goToAppointments()" class="w-full py-4 px-6 bg-gray-900 text-white rounded-xl font-bold text-lg hover:bg-gray-800 transition-colors shadow-sm">
        Xem Lịch Hẹn Của Tôi
      </button>
      <a routerLink="/" class="inline-block w-full py-3 px-6 text-gray-600 font-medium hover:bg-gray-50 rounded-xl transition-colors">
        Trở về trang chủ
      </a>
    </div>

  </div>
</div>
