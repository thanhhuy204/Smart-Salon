<footer class="bg-[#0A0A0A] text-white pt-16 pb-8 px-6" role="contentinfo">
  <div class="max-w-4xl mx-auto flex flex-col items-center gap-10">

    <!-- Logo & tagline -->
    <div class="flex flex-col items-center gap-3">
      <img src="assets/images/logo.jpeg" alt="Salon logo"
           class="w-16 h-16 rounded-full object-cover ring-2 ring-[#C9A447] shadow-xl"
           style="object-position: center" />
      <span class="font-bebas text-2xl tracking-[0.2em] text-white">SALON</span>
      <p class="text-xs tracking-[0.2em] uppercase text-[#C9A447]">Premium Barbershop</p>
    </div>

    <!-- Divider -->
    <div class="w-px h-8 bg-[#C9A447]/30"></div>

    <!-- Social -->
    <div class="flex flex-col items-center gap-5">
      <p class="text-[0.65rem] tracking-[0.25em] uppercase text-gray-500">Follow Us</p>
      <div class="flex items-center gap-5">
        @for (social of socialLinks; track social.platform) {
          @if (social.url) {
            <a
              [href]="social.url"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="social.ariaLabel"
              class="social-icon w-9 h-9 flex items-center justify-center border border-white/10
                     rounded-full text-gray-400 hover:text-[#C9A447] hover:border-[#C9A447]/50
                     transition-all duration-250"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
                   fill="currentColor" aria-hidden="true">
                <path [attr.d]="social.svgPath" />
              </svg>
            </a>
          }
        }
      </div>
    </div>

    <!-- Divider -->
    <div class="w-24 h-px bg-white/8"></div>

    <!-- Contact -->
    <div class="flex flex-col sm:flex-row items-center gap-4 sm:gap-10 text-gray-500 text-xs tracking-wide">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#C9A447]" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
                   19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1
                   4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0
                   1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1
                   2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>0912 345 678</span>
      </div>
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#C9A447]" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span>138 Cần Vương, Quy Nhơn, Gia Lai</span>
      </div>
    </div>

    <!-- Copyright -->
    <div class="border-t border-white/5 pt-6 w-full text-center">
      <p class="text-gray-600 text-[0.65rem] tracking-widest uppercase">
        &copy; {{ currentYear }} Salon &nbsp;·&nbsp; All rights reserved
      </p>
    </div>

  </div>
</footer>
